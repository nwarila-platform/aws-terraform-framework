repos:
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: make fmt
        language: system
        pass_filenames: false
        files: ^(terraform|overlays)/.*\.(tf|tfvars|tftest\.hcl)$

      - id: terraform-docs
        name: terraform-docs
        entry: make docs
        language: system
        pass_filenames: false
        files: ^(terraform|overlays)/.*\.tf$

      - id: docs-layout
        name: docs layout
        entry: python tools/check_docs_layout.py
        language: system
        pass_filenames: false
        files: ^docs/.*\.md$|^tools/check_docs_layout.py$
