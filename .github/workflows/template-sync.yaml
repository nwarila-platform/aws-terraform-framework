name: Template Sync
# Detects drift between this consumer and the canonical
# NWarila/terraform-framework-template baseline manifest.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: template-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: framework-template / verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # required for drift-gate to read this repository's baseline manifest
      checks: write # required for drift-gate to publish inline PR annotations
    steps:
      - name: Drift gate (framework-template baseline)
        # renovate: datasource=git-refs depName=NWarila/drift-gate
        uses: NWarila/drift-gate@dac07c2b2a30a084b3577d4712549291ae99879c # NWarila/drift-gate main @ 2026-05-30
        with:
          source-repo: NWarila/terraform-framework-template
          # renovate: depName=NWarila/terraform-framework-template packageName=NWarila/terraform-framework-template
          source-ref: 74ebe3340593c00770d6c8378966d23ab19fd9aa # NWarila/terraform-framework-template remediation baseline
          manifest: baseline-manifest.json
          check-name: framework-template / verify
